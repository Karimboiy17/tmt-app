<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Davomat — TMT</title>
<link rel="stylesheet" href="../style.css?v=54">
<script src="../assets/telegram-web-app.js"></script>
<script src="../assets/tg.js?v=54"></script>
<style>
  .wrap{max-width:520px;margin:0 auto;padding:16px}
  .back{color:var(--dim);text-decoration:none;font-size:14px}
  h1{font-size:20px;margin:12px 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
  video#cam{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;background:#000;border:1px solid var(--line)}
  .btns{display:grid;gap:10px;margin-top:14px}
  button{border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:600;font-family:inherit}
  .rec{background:var(--amber);color:#12161a}
  .stop{background:#e5484d;color:#fff}
  .send{background:var(--ok);color:#08110c}
  .ghost{background:var(--panel);color:var(--tx);border:1px solid var(--line)}
  button:disabled{opacity:.45}
  .note{margin-top:12px}
  .note textarea{width:100%;min-height:64px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:10px;font-family:inherit;font-size:14px}
  .st{margin-top:12px;font-size:14px;color:var(--dim);min-height:20px}
  .st.ok{color:var(--ok)} .st.err{color:#e5484d}
  .came{margin:0 0 14px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
  .came-h{font-size:14px;font-weight:600;margin-bottom:6px}
  .came-r{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
  .came-r:first-child{border-top:0}
  .came-n{color:var(--tx)} .came-m{color:var(--dim);white-space:nowrap}
  .came-e{font-size:13px;color:var(--dim)}
</style>
<link rel="stylesheet" href="../assets/ui.css?v=54">
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← Orqaga</a>
  <h1>Davomat</h1>
  <p class="sub" id="sub">Kamera ochilishi kerak</p>
  <p class="sub" id="today"></p>

  <div class="came" id="came" hidden>
    <div class="came-h" id="cameH">Bugun kelganlar</div>
    <div id="cameL"></div>
  </div>

  <video id="cam" autoplay playsinline muted></video>
  <input type="file" id="fVid" accept="video/*" capture="environment" style="display:none">

  <div class="note">
    <textarea id="note" placeholder="Izoh (majburiy emas)"></textarea>
  </div>

  <div class="btns">
    <button class="rec" id="bRec" disabled>⏺ Yozishni boshlash</button>
    <button class="stop" id="bStop" hidden>⏹ To‘xtatish</button>
    <button class="send" id="bIn" hidden>💼 Ishga keldim — yuborish</button>
    <button class="send" id="bOut" hidden>🚪 Ishdan ketdim — yuborish</button>
    <button class="ghost" id="bRetry" hidden>🔄 Kamerani qayta urinish</button>
    <button class="ghost" id="bFile" hidden>🎥 Tizim kamerasi bilan yozish</button>
  </div>

  <div class="st" id="st"></div>
</div>

<script>
var API = "https://maintenance-production-d87e.up.railway.app/api/tmt/upload";
var cam = document.getElementById("cam");
var st  = document.getElementById("st");
var blob = null, rec = null, chunks = [], stream = null;
var recStart = 0, recSecs = 0, recTick = null, MAXSEC = 60;
function fmtSec(s){ return Math.floor(s/60) + ":" + ("0" + (s%60)).slice(-2); }

function say(msg, cls){ st.textContent = msg || ""; st.className = "st" + (cls ? " " + cls : ""); }

var ATT = "https://maintenance-production-d87e.up.railway.app/api/tmt/attendance";
function initLen(){ return window.tgInitLen ? tgInitLen() : 0; }
function checkCtx(){
  if (initLen() > 0) return true;
  var w = document.getElementById("today");
  if (w) w.textContent = "⚠️ Telegram ma'lumoti topilmadi. Sahifani Telegramdagi «Ilova» tugmasidan oching.";
  return false;
}
tgWaitInit(checkCtx);
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function loadToday(){
  tgFetch(ATT).then(function(r){ return r.json(); }).then(function(j){
    if (!j || !j.ok) return;
    var txt = j.state === "offline" ? "Bugun hali kirilmagan"
            : (j.t_in || "—") + " kirdi" + (j.t_out ? " · " + j.t_out + " ketdi" : " · hali ishda");
    document.getElementById("today").textContent = "Bugun: " + txt;

    var box = document.getElementById("came");
    var L = j.list || [];
    if (!j.can_see_all) { box.hidden = true; return; }
    document.getElementById("cameH").textContent =
      "Bugun kelganlar · " + L.length + " kishi";
    document.getElementById("cameL").innerHTML = L.length
      ? L.map(function(x){
          var right = x.t_in + (x.t_out ? " → " + x.t_out : "");
          return '<div class="came-r"><span class="came-n">' + esc(x.name) +
                 (x.branch ? ' · ' + esc(x.branch) : "") +
                 '</span><span class="came-m">' + esc(right) + '</span></div>';
        }).join("")
      : '<div class="came-e">Bugun hali hech kim video bilan kirmagan</div>';
    box.hidden = false;
  }).catch(function(){});
}
loadToday();

function camLive(){
  if (!stream) return false;
  var ts = stream.getTracks ? stream.getTracks() : [];
  for (var i = 0; i < ts.length; i++) if (ts[i].readyState === "live") return true;
  return false;
}
function camStop(){
  try { if (stream) stream.getTracks().forEach(function(t){ t.onended = null; t.stop(); }); } catch (e) {}
  stream = null; cam.srcObject = null;
}
function showFile(on){
  document.getElementById("bFile").hidden = !on;
  document.getElementById("bRetry").hidden = !on;
}
function camErr(e){
  var n = (e && e.name) || "";
  if (n === "NotAllowedError" || n === "SecurityError")
    return "Kamera ruxsati berilmagan. Telegram → Sozlamalar → Kamera ruxsatini yoqing, keyin «Kamerani qayta urinish»ni bosing.";
  if (n === "NotReadableError" || n === "TrackStartError")
    return "Kamera band — boshqa ilova kamerani ishlatyapti. Uni yopib «Kamerani qayta urinish»ni bosing.";
  if (n === "NotFoundError" || n === "OverconstrainedError")
    return "Kamera topilmadi — «Tizim kamerasi bilan yozish» tugmasidan foydalaning.";
  return "Kamera ochilmadi (" + (n || "xato") + "). «Kamerani qayta urinish»ni bosing.";
}
function openCam(cb){
  camStop();
  var v = cam; v.src = ""; v.controls = false;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    say("Brauzerda kamera API yo‘q — «Tizim kamerasi bilan yozish»dan foydalaning", "err");
    showFile(true); if (cb) cb(false); return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
    .then(function (s) {
      stream = s; cam.srcObject = s;
      s.getTracks().forEach(function (t) { t.onended = function () { if (stream === s) stream = null; }; });
      try { var p = cam.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
      document.getElementById("bRec").disabled = false;
      document.getElementById("sub").textContent = "Videoni yozing (10–20 soniya)";
      showFile(false);
      if (cb) cb(true);
    })
    .catch(function (e) {
      document.getElementById("bRec").disabled = true;
      say(camErr(e), "err");
      showFile(true);
      if (cb) cb(false);
    });
}
openCam();
document.getElementById("bRetry").onclick = function () { say("Kamera qayta ochilmoqda…"); openCam(); };
document.getElementById("bFile").onclick = function () { document.getElementById("fVid").click(); };
document.getElementById("fVid").onchange = function () {
  var f = this.files && this.files[0]; this.value = "";
  if (!f) { say("Video tanlanmadi", "err"); return; }
  if (Date.now() - (f.lastModified || 0) > 300000){
    say("Faqat hoziroq yozilgan video qabul qilinadi — kamerani ochib qayta yozing", "err");
    return;
  }
  camStop();
  blob = f; recSecs = 0;
  cam.src = URL.createObjectURL(f); cam.controls = true;
  document.getElementById("bRec").hidden = true;
  document.getElementById("bIn").hidden = false;
  document.getElementById("bOut").hidden = false;
  document.getElementById("sub").textContent = "Video tanlandi — tugmani bosing";
  say("Video tayyor — «Ishga keldim» yoki «Ishdan ketdim»ni bosing", "ok");
};

document.getElementById("bRec").onclick = function () {
  if (!camLive()) {
    say("Kamera uzildi — qayta ochilmoqda…");
    openCam(function (ok) { if (ok) document.getElementById("bRec").click(); });
    return;
  }
  chunks = [];
  var mime = "";
  if (window.MediaRecorder) {
    if (MediaRecorder.isTypeSupported("video/mp4")) mime = "video/mp4";
    else if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9")) mime = "video/webm;codecs=vp9";
    else if (MediaRecorder.isTypeSupported("video/webm")) mime = "video/webm";
  }
  try {
    rec = mime ? new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1200000 })
               : new MediaRecorder(stream);
  } catch (e) { say("Yozib bo‘lmadi: " + e.message, "err"); return; }

  rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
  rec.onstop = function () {
    clearInterval(recTick);
    recSecs = Math.min(MAXSEC, Math.max(1, Math.round((Date.now() - recStart) / 1000)));
    blob = new Blob(chunks, { type: rec.mimeType || "video/webm" });
    cam.srcObject = null; cam.src = URL.createObjectURL(blob); cam.controls = true;
    document.getElementById("bRec").hidden = true;
    document.getElementById("bStop").hidden = true;
    document.getElementById("bIn").hidden = false;
    document.getElementById("bOut").hidden = false;
    say("Video tayyor (" + recSecs + " sek) — keldim yoki ketdim tugmasini bosing");
  };
  rec.start();
  this.hidden = true;
  document.getElementById("bStop").hidden = false;
  recStart = Date.now(); recSecs = 0;
  clearInterval(recTick);
  recTick = setInterval(function () {
    var s = Math.floor((Date.now() - recStart) / 1000);
    say("Yozilmoqda… " + fmtSec(s) + " / 1:00");
    if (s >= MAXSEC && rec && rec.state === "recording") { say("1 daqiqa limit — yozuv to‘xtatildi"); rec.stop(); }
  }, 500);
};

document.getElementById("bStop").onclick = function () {
  if (rec && rec.state === "recording") rec.stop();
};

function send(purpose, btn) {
  if (!blob) { say("Avval video yozing", "err"); return; }
  if (recSecs > MAXSEC){ say("Video " + recSecs + " sek — limit 1 daqiqa, qayta yozing", "err"); return; }
  if (!checkCtx()) { say("Telegram ma'lumoti yo'q — «Ilova» tugmasidan oching", "err"); return; }
  var fd = new FormData();
  fd.append("file", blob, "davomat." + ((blob.type.indexOf("mp4") >= 0) ? "mp4" : "webm"));
  fd.append("kind", "video");
  fd.append("purpose", purpose);
  fd.append("duration", String(recSecs || 0));
  fd.append("caption", document.getElementById("note").value.trim());

  ["bIn", "bOut"].forEach(function (id) { document.getElementById(id).disabled = true; });
  say("Yuborilmoqda…");
  tgFetch(API, { method: "POST", body: fd })
    .then(function (r) { return r.json().then(function (j) { return { code: r.status, j: j }; }); })
    .then(function (res) {
      if (res.j && res.j.ok) {
        var a = res.j.attendance || {};
        var extra = a.saved ? " · jadvalga yozildi" : (a.note ? " · " + a.note : "");
        say("✅ Yuborildi — guruhga tushdi" + extra, "ok");
        loadToday();
        if (window.Telegram && Telegram.WebApp) Telegram.WebApp.HapticFeedback &&
          Telegram.WebApp.HapticFeedback.notificationOccurred("success");
      } else {
        say("Xato: " + ((res.j && res.j.error) || res.code), "err");
        ["bIn", "bOut"].forEach(function (id) { document.getElementById(id).disabled = false; });
      }
    })
    .catch(function (e) {
      say("Tarmoq xatosi: " + e.message, "err");
      ["bIn", "bOut"].forEach(function (id) { document.getElementById(id).disabled = false; });
    });
}

document.getElementById("bIn").onclick  = function () { send("checkin", this); };
document.getElementById("bOut").onclick = function () { send("checkout", this); };
</script>
</body>
</html>
