<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vazifalar — TMT</title>
<link rel="stylesheet" href="../style.css?v=56">
<script src="../assets/telegram-web-app.js"></script>
<script src="../assets/tg.js?v=56"></script>
<script src="../assets/notif.js?v=56"></script>
<style>
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
  .back{color:var(--dim);text-decoration:none;font-size:14px}
  h1{font-size:20px;margin:12px 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:12px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--tx);
    border-radius:12px;padding:9px;font-size:13px;font-family:inherit}
  .tabs button.on{background:var(--ok);color:#08110c;border-color:var(--ok);font-weight:700}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
  .card.deep{border-color:#a855f7;box-shadow:0 0 0 2px rgba(168,85,247,.35)}
  .card .t{font-weight:600;font-size:15px;margin-bottom:4px}
  .card .n{font-size:13px;color:var(--dim);white-space:pre-wrap}
  .card .m{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--dim)}
  .tag{background:#1b2229;border:1px solid var(--line);border-radius:8px;padding:2px 8px}
  .tag.late{background:#3a1d1f;border-color:#e5484d;color:#ffb3b5}
  .tag.ok{background:#12301f;border-color:var(--ok);color:#8ef0b6}
  .row{display:flex;gap:8px;margin-top:10px}
  .row button{flex:1;border:0;border-radius:12px;padding:11px;font-size:14px;font-weight:600;font-family:inherit}
  .done{background:var(--ok);color:#08110c}
  .ghost{background:#1b2229;color:var(--tx);border:1px solid var(--line)}
  .empty{color:var(--dim);font-size:14px;text-align:center;padding:24px 0}
  .form{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:16px}
  .form h2{font-size:15px;margin:0 0 10px}
  .form input,.form textarea,.form select{width:100%;background:#12171c;border:1px solid var(--line);
    border-radius:10px;color:var(--tx);padding:10px;font-family:inherit;font-size:14px;margin-bottom:8px}
  .form textarea{min-height:60px}
  .staff{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:8px}
  .staff label{display:flex;gap:10px;align-items:center;font-size:14px;padding:11px 12px;margin:0 0 6px;
    border:1px solid transparent;border-radius:11px;cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:background .12s,border-color .12s}
  .staff label:last-child{margin-bottom:0}
  .staff label:has(input:checked){background:rgba(231,238,97,.13);border-color:rgba(231,238,97,.5)}
  .staff label:has(input:checked) .nm{font-weight:650;color:#f4f7cf}
  .staff .nm{flex:1 1 auto;min-width:0}
  .staff .br{flex:0 0 auto;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%}
  .pickcnt{font-size:12.5px;color:var(--dim);padding:0 2px 8px}
  .form .send{width:100%;background:var(--ok);color:#08110c;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:700}
  #sheet{position:fixed;inset:0;background:#000d;display:none;align-items:flex-end;z-index:50}
  #sheet.on{display:flex}
  #pv{position:fixed;inset:0;background:#000d;display:none;align-items:flex-end;z-index:60}
  #pv.on{display:flex}
  #pv .in{background:var(--panel);width:100%;padding:14px 14px calc(14px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0;max-height:92vh;overflow:auto}
  #asheet{position:fixed;inset:0;background:#000d;display:none;align-items:flex-end;z-index:50}
  #asheet.on{display:flex}
  #asheet .in{background:var(--panel);width:100%;padding:14px;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto}
  #sheet .in{background:var(--panel);width:100%;padding:14px;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto}
  video#cam{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:#000}
  .st{font-size:13px;color:var(--dim);min-height:18px;margin-top:8px}
  .st.err{color:#e5484d} .st.ok{color:var(--ok)}
</style>
<link rel="stylesheet" href="../assets/ui.css?v=56">
</head>
<body data-sec="tasks">
<div class="wrap">
  <a class="back" href="../index.html">← Orqaga</a>
  <h1>Vazifalar</h1>
  <p class="sub" id="who">yuklanmoqda…</p>

  <div class="tabs">
    <button id="tA" class="on">Faol</button>
    <button id="tD">Bajarilgan</button>
  </div>

  <div id="list"></div>

  <div class="form" id="newBox" hidden>
    <h2>➕ Yangi vazifa</h2>
    <input id="nTitle" placeholder="Vazifa nomi">
    <textarea id="nNote" placeholder="Izoh (majburiy emas)"></textarea>
    <input id="nDate" type="date">
    <select id="nRepeat">
      <option value="once">Bir martalik</option>
      <option value="daily">Har kuni</option>
      <option value="weekly">Har hafta</option>
    </select>
    <div class="pickcnt" id="staffCnt">Xodim tanlanmagan</div>
    <div class="staff" id="staff"></div>
    <button class="send" id="bCreate">Vazifani berish</button>
    <div class="st" id="nSt"></div>
  </div>
</div>

<div id="asheet">
  <div class="in">
    <h2 style="font-size:16px;margin:0 0 10px">👤 Xodimga biriktirish</h2>
    <div class="staff" id="aStaff"></div>
    <div class="row">
      <button class="done" id="aSend">Biriktirish</button>
      <button class="ghost" id="aClose">Yopish</button>
    </div>
    <div class="st" id="aSt"></div>
  </div>
</div>

<div id="pv">
  <div class="in">
    <h2 style="font-size:16px;margin:0 0 10px">📎 Isbot</h2>
    <video id="pvV" controls playsinline style="width:100%;max-height:58vh;object-fit:contain;border-radius:12px;background:#000;display:none"></video>
    <img id="pvI" alt="" style="width:100%;max-height:58vh;object-fit:contain;border-radius:12px;display:none">
    <div id="pvNote" style="font-size:13px;color:var(--dim);margin-top:10px"></div>
    <div class="row"><button class="ghost" id="pvClose">Yopish</button></div>
  </div>
</div>

<div id="sheet">
  <div class="in">
    <h2 style="font-size:16px;margin:0 0 10px" id="sTitle">Isbot</h2>
    <video id="cam" autoplay playsinline muted></video>
    <input type="file" id="fVid" accept="video/*" capture="environment" style="display:none">
    <textarea id="sNote" placeholder="Izoh" style="width:100%;min-height:56px;margin-top:10px;background:#12171c;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:10px;font-family:inherit"></textarea>
    <div class="row">
      <button class="ghost" id="bRec">⏺ Yozish</button>
      <button class="ghost" id="bStop" hidden>⏹ To‘xtatish</button>
      <button class="done" id="bSend">Yuborish</button>
      <button class="ghost" id="bClose">Yopish</button>
    </div>
    <div class="row">
      <button class="ghost" id="bRetry" hidden>🔄 Kamerani qayta urinish</button>
      <button class="ghost" id="bPick" hidden>🎥 Tizim kamerasi</button>
    </div>
    <div class="st" id="sSt"></div>
  </div>
</div>

<script>
var API = "https://maintenance-production-d87e.up.railway.app";
var TASKS = API + "/api/tmt/tasks";
var UP = API + "/api/tmt/upload";

var status = "active", isManager = false, staffList = [], cur = null;
var blob = null, rec = null, chunks = [], stream = null;
var recStart = 0, recSecs = 0, recTimer = null, recTick = null;
var MAXSEC = 60;

function $(id){ return document.getElementById(id); }
function say(el, msg, cls){ var e=$(el); e.textContent = msg||""; e.className="st"+(cls?" "+cls:""); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

function initLen(){ return window.tgInitLen ? tgInitLen() : 0; }
tgWaitInit(function(d){
  if (!d) $("who").textContent = "⚠️ Telegram ma'lumoti yo'q — «Ilova» tugmasidan oching";
});

function loadMe(){
  return tgFetch(API + "/api/webapp/me", {cache:"no-store"}).then(function(r){ return r.json(); })
    .then(function(j){
      if (!j || !j.ok) return;
      isManager = !!(j.manager || (j.perms && j.perms.manage));
      $("who").textContent = (j.name || "xodim") + (j.role === "ceo" ? " · CEO" : (j.manager ? " · menejer" : ""));
      if (isManager){ $("newBox").hidden = false; loadStaff(); }
    }).catch(function(){});
}

function loadStaff(){
  tgFetch(API + "/api/tmt/staff", {cache:"no-store"}).then(function(r){ return r.json(); })
    .then(function(j){
      if (!j || !j.ok) return;
      staffList = j.staff || [];
      $("staff").innerHTML = staffList.map(function(s){
        return '<label><input type="checkbox" value="'+s.cid+'" data-name="'+esc(s.name)+'">'+
               '<span class="nm">'+esc(s.name)+'</span>'+
               (s.branch ? '<span class="br">'+esc(s.branch)+'</span>' : '') + '</label>';
      }).join("") || '<div style="font-size:13px;color:var(--dim);padding:6px">Xodim topilmadi</div>';
      $("staff").onchange = function(){ staffCount(); sayClear(); };
      staffCount();
    }).catch(function(){});
}

function staffCount(){
  var n = document.querySelectorAll("#staff input:checked").length;
  var el = $("staffCnt");
  if (el) el.textContent = n ? ("Tanlandi: " + n + " xodim") : "Xodim tanlanmagan";
}

/* eski natija xabari yangi vazifa kiritishni chalg'itmasin */
function sayClear(){ var el = $("nSt"); if (el && el.textContent) el.textContent = ""; }

function deadlineTag(t){
  if (!t.deadline) return '';
  var d = new Date(t.deadline + "T23:59:59");
  var late = t.status !== "done" && d < new Date();
  return '<span class="tag '+(late?"late":"")+'">📅 '+t.deadline+(late?" · kechikkan":"")+'</span>';
}

function when(iso){
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return '';
  var p = function(n){ return String(n).padStart(2,'0'); };
  return p(d.getDate())+'.'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes());
}

var DEEP = (function(){ try { return (new URLSearchParams(location.search)).get("id") || ""; }
  catch(e){ var m = location.search.match(/[?&]id=([^&]+)/); return m ? decodeURIComponent(m[1]) : ""; } })();
var DEEP_TRIED = false;
function focusDeep(){
  if (!DEEP) return false;
  var el = document.querySelector('.card[data-id="'+DEEP+'"]');
  if (!el) return false;
  el.classList.add("deep");
  try { el.scrollIntoView({block:"center",behavior:"smooth"}); } catch(e){}
  return true;
}

function render(items){
  if (!items.length){ $("list").innerHTML = '<div class="empty">'+(status==="active"?"Faol vazifa yo‘q ✅":"Hali bajarilgan yo‘q")+'</div>'; return; }
  $("list").innerHTML = items.map(function(t){
    return '<div class="card" data-id="'+t.id+'">' +
      '<div class="t">'+esc(t.title)+'</div>' +
      (t.note ? '<div class="n">'+esc(t.note)+'</div>' : '') +
      '<div class="m">' + deadlineTag(t) +
        (t.status==="done" ? '<span class="tag ok">✅ bajarildi</span>' : '') +
        (t.status==="done" && t.done_at ? '<span class="tag">🕒 '+when(t.done_at)+'</span>' : '') +
        (isManager ? '<span class="tag">👤 '+esc(t.assignee_name||t.assignee)+'</span>' : '') +
        (t.repeat && t.repeat!=="once" ? '<span class="tag">🔁 '+(t.repeat==="daily"?"har kuni":"har hafta")+'</span>' : '') +
      '</div>' +
      (t.status==="done" && t.proof_url ? '<div class="row">' +
        '<button class="ghost" data-pv="'+t.proof_url+'" data-kind="'+(t.proof_kind||'video')+'" ' +
        'data-note="'+encodeURIComponent(t.proof_note||'')+'" onclick="openProofView(this)">📎 Isbotni ko\'rish</button>' +
      '</div>' : '') +
      (t.status!=="done" ? '<div class="row">' +
        '<button class="done" onclick="openProof('+t.id+',\''+esc(t.title).replace(/'/g,"")+'\')">✅ Isbot bilan yopish</button>' +
        (isManager ? '<button class="ghost" onclick="openAssign('+t.id+')">👤 Biriktirish</button>' : '') +
      '</div>' : '') +
    '</div>';
  }).join("");
}

function load(){
  $("list").innerHTML = '<div class="empty">yuklanmoqda…</div>';
  tgFetch(TASKS + "?status=" + status, {cache:"no-store"})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j || !j.ok){ $("list").innerHTML = '<div class="empty">Xato: '+esc((j&&j.error)||'')+'</div>'; return; }
      render(j.tasks||[]);
      if (DEEP){
        if (!focusDeep() && status==="active" && !DEEP_TRIED){
          DEEP_TRIED = true; status="done";
          $("tD").classList.add("on"); $("tA").classList.remove("on");
          load();
        }
      }
    })
    .catch(function(e){ $("list").innerHTML = '<div class="empty">Tarmoq xatosi: '+esc(e.message)+'</div>'; });
}

$("tA").onclick = function(){ status="active"; this.classList.add("on"); $("tD").classList.remove("on"); load(); };
$("tD").onclick = function(){ status="done"; this.classList.add("on"); $("tA").classList.remove("on"); load(); };

/* ---- isbot oynasi ---- */
function openProof(id, title){
  if (!initLen()) tgWaitInit(function(d){ if (!d) alert("Telegram ma'lumoti yo'q — «Ilova» tugmasidan oching"); });
  cur = id; $("sTitle").textContent = "Isbot — " + title;
  $("sNote").value = ""; blob = null; say("sSt","");
  $("sheet").classList.add("on");
  openCam();
}

function camLive(){
  if (!stream) return false;
  var ts = stream.getTracks ? stream.getTracks() : [];
  for (var i=0;i<ts.length;i++) if (ts[i].readyState === "live") return true;
  return false;
}
function camStop(){
  try { if (stream) stream.getTracks().forEach(function(t){ t.onended=null; t.stop(); }); } catch(e){}
  stream = null; if ($("cam")) $("cam").srcObject = null;
}
function camErr(e){
  var n = (e && e.name) || "";
  if (n === "NotAllowedError" || n === "SecurityError")
    return "Kamera ruxsati berilmagan. Telegram → Sozlamalar → Kamera ruxsatini yoqing, keyin «Kamerani qayta urinish»ni bosing.";
  if (n === "NotReadableError" || n === "TrackStartError")
    return "Kamera band — boshqa ilova kamerani ishlatyapti. Uni yopib «Kamerani qayta urinish»ni bosing.";
  if (n === "NotFoundError" || n === "OverconstrainedError")
    return "Kamera topilmadi — «Tizim kamerasi» tugmasidan foydalaning.";
  return "Kamera ochilmadi (" + (n || "xato") + "). «Kamerani qayta urinish»ni bosing.";
}
function openCam(cb){
  camStop();
  $("cam").src = ""; $("cam").controls = false;
  $("bRetry").hidden = true; $("bPick").hidden = true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    say("sSt","Brauzerda kamera API yo‘q — «Tizim kamerasi»dan foydalaning","err");
    $("bPick").hidden = false; if (cb) cb(false); return;
  }
  navigator.mediaDevices.getUserMedia({ video:{facingMode:"user"}, audio:false })
    .then(function(s){
      stream = s; $("cam").srcObject = s;
      s.getTracks().forEach(function(t){ t.onended = function(){ if (stream === s) stream = null; }; });
      try { var p = $("cam").play(); if (p && p.catch) p.catch(function(){}); } catch(e){}
      $("bRec").hidden = false;
      say("sSt","Video yozing yoki to‘g‘ridan yuboring");
      if (cb) cb(true);
    })
    .catch(function(e){
      say("sSt", camErr(e), "err");
      $("bRetry").hidden = false; $("bPick").hidden = false;
      if (cb) cb(false);
    });
}
$("bRetry").onclick = function(){ say("sSt","Kamera qayta ochilmoqda…"); openCam(); };
$("bPick").onclick = function(){ $("fVid").click(); };
$("fVid").onchange = function(){
  var fl = this.files && this.files[0]; this.value = "";
  if (!fl) { say("sSt","Video tanlanmadi","err"); return; }
  if (Date.now() - (fl.lastModified || 0) > 300000){
    say("sSt","Faqat hoziroq yozilgan video qabul qilinadi — kamerani ochib qayta yozing","err");
    return;
  }
  camStop(); blob = fl; recSecs = 0;
  $("cam").src = URL.createObjectURL(fl); $("cam").controls = true;
  $("bRec").hidden = true; $("bStop").hidden = true;
  say("sSt","Video tayyor — «Yuborish»ni bosing","ok");
};

function closeProof(){
  camStop();
  $("bRetry").hidden = true; $("bPick").hidden = true;
  $("cam").srcObject=null; $("sheet").classList.remove("on");
  $("bRec").hidden=false; $("bStop").hidden=true;
}

$("bClose").onclick = closeProof;

$("bRec").onclick = function(){
  if (!camLive()){
    say("sSt","Kamera uzildi — qayta ochilmoqda…");
    openCam(function(ok){ if (ok) $("bRec").click(); });
    return;
  }
  chunks = [];
  var mime = "";
  if (window.MediaRecorder){
    if (MediaRecorder.isTypeSupported("video/mp4")) mime="video/mp4";
    else if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9")) mime="video/webm;codecs=vp9";
    else if (MediaRecorder.isTypeSupported("video/webm")) mime="video/webm";
  }
  try { rec = mime ? new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1200000}) : new MediaRecorder(stream); }
  catch(e){ say("sSt","Yozib bo‘lmadi: "+e.message,"err"); return; }
  rec.ondataavailable = function(ev){ if (ev.data && ev.data.size) chunks.push(ev.data); };
  rec.onstop = function(){
    if (recTick){ clearInterval(recTick); recTick = null; }
    if (recTimer){ clearTimeout(recTimer); recTimer = null; }
    recSecs = Math.min(MAXSEC, Math.max(1, Math.round((Date.now()-recStart)/1000)));
    blob = new Blob(chunks,{type:rec.mimeType||"video/webm"});
    $("cam").srcObject=null; $("cam").src=URL.createObjectURL(blob); $("cam").controls=true;
    $("bRec").hidden=true; $("bStop").hidden=true;
    say("sSt","Video tayyor ("+recSecs+" sek) — «Yuborish»ni bosing","ok");
  };
  rec.start(); this.hidden=true; $("bStop").hidden=false;
  recStart = Date.now(); recSecs = 0;
  say("sSt","Yozilmoqda… 60 sek");
  recTick = setInterval(function(){
    var el = Math.floor((Date.now()-recStart)/1000);
    say("sSt","Yozilmoqda… " + Math.max(0, MAXSEC-el) + " sek qoldi");
  }, 1000);
  recTimer = setTimeout(function(){
    try { if (rec && rec.state==="recording"){ rec.stop(); } } catch(e){}
  }, MAXSEC*1000);
};

$("bStop").onclick = function(){ if (rec && rec.state==="recording") rec.stop(); };

$("bSend").onclick = function(){
  if (!cur) return;
  if (!initLen()) say("sSt","Telegram ma'lumoti kutilmoqda…","");
  var note = $("sNote").value.trim();
  $("bSend").disabled = true;

  if (blob){
    if (recSecs > MAXSEC + 1){ say("sSt","Video "+recSecs+" sek — limit 1 daqiqa","err"); $("bSend").disabled=false; return; }
    var fd = new FormData();
    fd.append("file", blob, "vazifa." + (blob.type.indexOf("mp4")>=0 ? "mp4":"webm"));
    fd.append("kind","video");
    fd.append("purpose","task");
    fd.append("task_id", cur);
    fd.append("duration", String(recSecs||0));
    fd.append("caption", note);
    say("sSt","Yuborilmoqda…");
    tgFetch(UP,{method:"POST",body:fd})
      .then(function(r){ return r.json().then(function(j){ return {code:r.status,j:j}; }); })
      .then(function(res){
        $("bSend").disabled = false;
        if (res.j && res.j.ok){ say("sSt","✅ Yuborildi — guruhga tushdi","ok"); closeProof(); load(); }
        else say("sSt","Xato: "+((res.j&&res.j.error)||res.code),"err");
      })
      .catch(function(e){ $("bSend").disabled=false; say("sSt","Tarmoq xatosi: "+e.message,"err"); });
    return;
  }

  tgFetch(TASKS + "/" + cur + "/done", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({note:note})})
    .then(function(r){ return r.json().then(function(j){ return {code:r.status,j:j}; }); })
    .then(function(res){
      $("bSend").disabled = false;
      if (res.j && res.j.ok){ say("sSt","✅ Bajarildi","ok"); closeProof(); load(); }
      else say("sSt","Xato: "+((res.j&&res.j.error)||res.code),"err");
    })
    .catch(function(e){ $("bSend").disabled=false; say("sSt","Tarmoq xatosi: "+e.message,"err"); });
};

/* ---- isbotni ko'rish ---- */
function openProofView(el){
  var url = el.getAttribute("data-pv") || "";
  if (url.charAt(0) === "/") url = API + url;
  var kind = el.getAttribute("data-kind") || "video";
  var note = "";
  try { note = decodeURIComponent(el.getAttribute("data-note") || ""); } catch(e){}
  var v=$("pvV"), i=$("pvI");
  $("pvNote").textContent = note || "";
  if (kind === "photo"){ v.style.display="none"; v.removeAttribute("src"); i.style.display="block"; i.src=url; }
  else {
    i.style.display="none"; i.removeAttribute("src");
    v.style.display="block"; v.src=url;
    try { v.play().catch(function(){}); } catch(e){}
  }
  $("pv").classList.add("on");
}
function closeProofView(){
  var v=$("pvV");
  try { v.pause(); } catch(e){}
  v.removeAttribute("src"); v.style.display="none"; $("pvI").style.display="none";
  $("pv").classList.remove("on");
}
$("pvClose").onclick = closeProofView;
$("pv").addEventListener("click", function(e){ if (e.target === this) closeProofView(); });

/* ---- qayta biriktirish ---- */
var AID = 0;
function openAssign(id){
  AID = id; say("aSt","");
  $("aStaff").innerHTML = staffList.length ? staffList.map(function(s){
    return '<label><input type="radio" name="aPick" value="'+s.cid+'"> '+esc(s.name)+
      (s.branch ? ' <span style="color:var(--dim)">· '+esc(s.branch)+'</span>' : '')+'</label>';
  }).join("") : '<div style="font-size:13px;color:var(--dim);padding:6px">Xodim topilmadi</div>';
  $("asheet").classList.add("on");
}
function closeAssign(){ $("asheet").classList.remove("on"); }
$("aClose").onclick = closeAssign;
$("aSend").onclick = function(){
  var p = document.querySelector('#aStaff input:checked');
  if (!p){ say("aSt","Xodim tanlang","err"); return; }
  say("aSt","yuborilmoqda…");
  var self = this; self.disabled = true;
  tgFetch(TASKS + "/" + AID + "/assign", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({cid: p.value})})
    .then(function(r){ return r.json().then(function(j){ return {code:r.status,j:j}; }); })
    .then(function(res){
      self.disabled = false;
      if (res.j && res.j.ok){ say("aSt","✅ biriktirildi","ok"); setTimeout(function(){ closeAssign(); load(); }, 600); }
      else say("aSt","Xato: "+((res.j&&res.j.error)||res.code),"err");
    })
    .catch(function(e){ self.disabled=false; say("aSt","Tarmoq xatosi: "+e.message,"err"); });
};

/* ---- yangi vazifa ---- */
$("bCreate").onclick = function(){
  var title = $("nTitle").value.trim();
  var picked = [].slice.call(document.querySelectorAll("#staff input:checked"));
  if (!title){ say("nSt","Vazifa nomini yozing","err"); return; }
  if (!picked.length){ say("nSt","Kamida bitta xodim tanlang","err"); return; }
  var names = {};
  picked.forEach(function(p){ names[p.value] = p.getAttribute("data-name") || ""; });
  say("nSt","Yuborilmoqda…");
  this.disabled = true;
  var self = this;
  tgFetch(TASKS, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({title:title, note:$("nNote").value.trim(), deadline:$("nDate").value||null,
      repeat:$("nRepeat").value, assignees:picked.map(function(p){return p.value;}), names:names})})
    .then(function(r){ return r.json().then(function(j){ return {code:r.status,j:j}; }); })
    .then(function(res){
      self.disabled = false;
      if (res.j && res.j.ok){
        var nAssigned = res.j.ids.length;
        say("nSt","✅ Berildi: "+nAssigned+" xodimga","ok");
        $("nTitle").value=""; $("nNote").value=""; $("nDate").value=""; $("nRepeat").value="once";
        picked.forEach(function(p){ p.checked=false; });
        staffCount();
        setTimeout(function(){ var e=$("nSt");
          if (e && e.textContent.indexOf("Berildi") !== -1) e.textContent = ""; }, 6000);
        status="active"; $("tA").classList.add("on"); $("tD").classList.remove("on"); load();
      } else say("nSt","Xato: "+((res.j&&res.j.error)||res.code),"err");
    })
    .catch(function(e){ self.disabled=false; say("nSt","Tarmoq xatosi: "+e.message,"err"); });
};

["nTitle","nNote","nDate"].forEach(function(id){
  var e = $(id); if (e) e.addEventListener("input", sayClear);
});
loadMe().then(load);
</script>
